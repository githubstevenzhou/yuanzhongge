<body>
<div id="site-header"></div>
<main><div class="container">
  <div class="page-head"><h1>清宫生男生女表</h1><div class="desc">清宫珍藏的生男生女预测表，女性年龄以农历虚龄（真实年龄加 1 岁）算，怀孕月份以农历为准。</div></div>

  <div class="panel">
    <h2>快速查询</h2>
    <form id="qgForm" onsubmit="return false">
      <div class="form-row"><label>母亲虚龄</label><div class="ctrl"><select id="nn" style="max-width:100px"></select></div></div>
      <div class="form-row"><label>怀孕农历月份</label><div class="ctrl"><select id="yue" style="max-width:100px"></select></div></div>
      <div class="form-row"><label></label><div class="ctrl"><button class="btn btn-gold" id="qgBtn">查询</button></div></div>
    </form>
    <div id="result"></div></div>

  <div class="panel">
    <h2>清宫生男生女预测表</h2>
    <div class="desc legend" style="margin-bottom:6px">
      <span class="boy">男</span><span class="girl">女</span>
      <span style="font-size:12px;color:#8a6a48;margin-left:8px">行：虚龄 18-45　列：农历怀孕月份 1-12</span></div>
    <div class="qg-wrap"><div id="grid">数据加载中...</div></div></div>

  <div class="panel">
    <h2>说明</h2>
    <div class="desc" style="line-height:1.9">
      <p>女性年龄以农历虚龄（即真实年龄加 1 岁）算，怀孕月份即受孕的那个农历月份。本预测表为转载的网络资料，仅供参考，不保证其真实性，请勿迷信。</p></div></div></div></main>
<div id="site-footer"></div>
<script src="../assets/js/lib/data.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
(function(){
  SHL.layout.setTitle('清宫生男生女表');
  var L=SHL.layout;
  function esc(s){ return L.esc(s); }
  var nnSel=document.getElementById('nn'), yueSel=document.getElementById('yue');
  for(var n=18;n<=45;n++){ nnSel.add(new Option(n+' 岁',n)); }
  for(var m=1;m<=12;m++){ yueSel.add(new Option(m+' 月',m)); }
  nnSel.value=22; yueSel.value=1;

  var rows=null;
  function ensureData(){
    if(rows) return Promise.resolve(rows);
    return SHL.data.rows('senlon_snsn').then(function(r){ rows=r; return r; });
  }
  function findByNn(nn){
    for(var i=0;i<rows.length;i++){ if(String(rows[i].nn)===String(nn)) return rows[i]; }
    return null;
  }
  function babyLabel(v){ return v==='男'?'男宝宝（小王子）':(v==='女'?'女宝宝（小公主）':v); }

  function renderGrid(){
    var h='<table class="qg-table"><thead><tr>';
    h+='<th rowspan="2">虚龄</th><th colspan="12">怀孕月份（农历）</th></tr><tr>';
    for(var m=1;m<=12;m++){ h+='<th class="month-h">'+m+'</th>'; }
    h+='</tr></thead><tbody>';
    for(var i=0;i<rows.length;i++){
      var row=rows[i];
      h+='<tr><td class="age">'+esc(row.nn)+'</td>';
      for(var mo=1;mo<=12;mo++){
        var v=row[String(mo)];
        var cls = v==='男'?'boy':'girl';
        h+='<td class="'+cls+'" data-nn="'+esc(row.nn)+'" data-yue="'+mo+'">'+esc(v)+'</td>';
      }
      h+='</tr>';
    }
    h+='</tbody></table>';
    document.getElementById('grid').innerHTML=h;
  }

  function highlight(nn,yue){
    var cells=document.querySelectorAll('.qg-table td');
    for(var i=0;i<cells.length;i++){ cells[i].classList.remove('hit'); }
    var sel='.qg-table td[data-nn="'+nn+'"][data-yue="'+yue+'"]';
    var cell=document.querySelector(sel);
    if(cell){ cell.classList.add('hit'); cell.scrollIntoView({block:'center'}); }
  }

  function query(){
    var nn=nnSel.value, yue=yueSel.value;
    var r=document.getElementById('result');
    ensureData().then(function(){
      var row=findByNn(nn);
      var v = row ? row[String(yue)] : '';
      var h='<div class="result-box">';
      h+='<p>母亲虚龄 <b style="color:#0066cc">'+esc(nn)+'</b>，怀孕农历 <b style="color:#0066cc">'+esc(yue)+'</b> 月：</p>';
      if(v){
        var cls = v==='男'?'tag-green':'tag-red';
        h+='<p style="font-size:18px">预测结果：<span class="tag '+cls+'">'+esc(v)+'</span> '+esc(babyLabel(v))+'</p>';
      } else {
        h+='<div class="error">未找到对应数据。</div>';
      }
      h+='</div>';
      r.innerHTML=h;
      highlight(nn,yue);
    }).catch(function(e){
      r.innerHTML='<div class="error">数据加载失败：'+esc(e.message)+'</div>';
    });
  }

  document.getElementById('qgBtn').onclick=query;
  ensureData().then(function(){ renderGrid(); query(); });
})();
</script>
