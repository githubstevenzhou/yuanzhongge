<script>
(function(){
  var L = SHL.layout;
  // 填充出生年月日
  var now=new Date(), ySel=document.getElementById('f_year'),mSel=document.getElementById('f_month'),dSel=document.getElementById('f_day'),hSel=document.getElementById('f_hour'),minSel=document.getElementById('f_min');
  for(var y=1940;y<=now.getFullYear();y++){ ySel.add(new Option(y,y)); }
  for(var m=1;m<=12;m++){ mSel.add(new Option(m,m)); }
  for(var d=1;d<=31;d++){ dSel.add(new Option(d,d)); }
  for(var h=0;h<=23;h++){ hSel.add(new Option(SHL.const.dizhiHour(h)+' '+h+'时',h)); }
  for(var mi=0;mi<=59;mi++){ minSel.add(new Option(mi,mi)); }
  ySel.value=now.getFullYear(); mSel.value=now.getMonth()+1; dSel.value=now.getDate(); hSel.value=12;

  // 模块网格
  function fillGrid(id, items){
    var el=document.getElementById(id); var h='';
    for(var i=0;i<items.length;i++){ h+='<a href="'+L.link(items[i].u)+'"><span class="ic">'+items[i].ic+'</span><span class="nm">'+items[i].n+'</span></a>'; }
    el.innerHTML=h;
  }
  fillGrid('grid-paipan',[
    {ic:'☰',n:'四柱八字',u:'ppbazi/'},{ic:'₪',n:'六爻起卦',u:'pp6y/'},
    {ic:'☀',n:'真太阳时',u:'taiyang/'},{ic:'olkata',n:'地区经度',u:'jingdu/'}
  ]);
  fillGrid('grid-qian',[
    {ic:'🌺',n:'观音灵签',u:'guanyin/'},{ic:'🍶',n:'吕祖灵签',u:'lvzu/'},{ic:'🌿',n:'黄大仙灵签',u:'huangdaxian/'},
    {ic:'⚔',n:'关圣帝灵签',u:'guandi/'},{ic:'⛵',n:'妈祖灵签',u:'mazu/'},{ic:'✒',n:'诸葛神算',u:'zgss/'},
    {ic:'🃏',n:'塔罗占卜',u:'tarot/'},{ic:'🪙',n:'金钱卦',u:'jqg/'},{ic:'🙏',n:'在线拜佛',u:'baifo/'}
  ]);
  fillGrid('grid-num',[
    {ic:'📱',n:'手机号码',u:'shouji/'},{ic:'💬',n:'QQ号码',u:'qqjx/'},{ic:'📞',n:'电话号码',u:'hmjx/'},
    {ic:'🪪',n:'身份证测算',u:'sfz/'},{ic:'🌐',n:'域名吉凶',u:'ymjxcs/'},{ic:'👤',n:'人品计算',u:'renpin/'},
    {ic:'📅',n:'万年历',u:'wannianli/'},{ic:'💤',n:'周公解梦',u:'zgjm/'}
  ]);
  fillGrid('grid-match',[
    {ic:'♈',n:'星座配对',u:'xzpd/'},{ic:'🐁',n:'生肖配对',u:'sxpd/'},{ic:'🩸',n:'血型配对',u:'xxpd/'},
    {ic:'💑',n:'名字配对',u:'xmpd/'},{ic:'👶',n:'生男生女',u:'snsn/'},{ic:'👁',n:'眼跳预测',u:'ytyc/'},
    {ic:'🤧',n:'喷嚏预测',u:'ptyc/'},{ic:'💓',n:'心惊预测',u:'xjyc/'},{ic:'👂',n:'耳鸣预测',u:'emyc/'}
  ]);

  // 排盘
  document.getElementById('bzBtn').onclick=function(){
    var y=parseInt(ySel.value),mo=parseInt(mSel.value),d=parseInt(dSel.value),h=parseInt(hSel.value),mi=parseInt(minSel.value)||0;
    var sex=document.getElementById('f_sex').value;
    if(!sex){ alert('请选择性别'); return; }
    if(!y||!mo||!d||isNaN(h)){ alert('请填写完整的出生时间'); return; }
    var calType=document.querySelector('input[name=caltype]:checked').value;
    // 输入转公历 (排盘内部按公历计算)
    var solarY=y, solarM=mo, solarD=d;
    var inputLunarStr='', isLeap=0;
    if(calType==='lunar'){
      isLeap=document.getElementById('f_leap').checked?1:0;
      var s=SHL.common.lunar.lunarToSolar(y,mo,d,isLeap==1);
      if(!s){ alert('农历日期无效，请检查是否选错闰月或日期超出范围'); return; }
      solarY=s.year; solarM=s.month; solarD=s.day;
      // 保存输入的农历显示串
      inputLunarStr=SHL.common.lunar.lunarStr({year:y,month:mo,day:d,isLeap:isLeap});
    }
    var esc=L.esc;
    var r=document.getElementById('result');
    r.innerHTML='<div class="loading">正在排盘...</div>';
    Promise.all([SHL.data.load('calendar_jq'), SHL.data.load('calendar_stime')]).then(function(arr){
      var jq=arr[0].terms, st=arr[1].items;
      // 首页快速排盘按北京时间计算 (经度默认120)
      var b=SHL.bazi.calc({year:solarY,month:solarM,day:solarD,hour:h,minute:mi,longitude:120}, jq, st);
      var html='<div class="result-box">';
      // 显示用户输入与对应公历
      if(calType==='lunar'){
        html+='<p class="center muted">输入：'+esc(inputLunarStr)+'</p>';
      }
      // 公历/农历对照
      var lunar=SHL.common.lunar.solarToLunar(b.solar.year, b.solar.month, b.solar.day);
      html+='<p class="center">公历：<b>'+b.solar.year+'年'+b.solar.month+'月'+b.solar.day+'日 '+String(b.solar.hour).padStart(2,'0')+':'+String(b.solar.minute).padStart(2,'0')+'</b>　生肖：<b>'+b.shengxiao+'</b></p>';
      if(lunar){
        html+='<p class="center muted">'+esc(SHL.common.lunar.lunarStr(lunar))+'</p>';
      }
      // 专业四柱表格
      var riGan=b.dgz.charAt(0), riZhi=b.dgz.charAt(1);
      var ssY=SHL.bazi.shishen(riGan, b.ygz.charAt(0));
      var ssM=SHL.bazi.shishen(riGan, b.mgz.charAt(0));
      var ssT=SHL.bazi.shishen(riGan, b.tgz.charAt(0));
      var dsY=SHL.bazi.dishi(riGan, b.ygz.charAt(1));
      var dsM=SHL.bazi.dishi(riGan, b.mgz.charAt(1));
      var dsD=SHL.bazi.dishi(riGan, riZhi);
      var dsT=SHL.bazi.dishi(riGan, b.tgz.charAt(1));
      var ssYArr=SHL.bazi.shensha(riGan, riZhi, b.ygz.charAt(1));
      var ssMArr=SHL.bazi.shensha(riGan, riZhi, b.mgz.charAt(1));
      var ssDArr=SHL.bazi.shensha(riGan, riZhi, riZhi);
      var ssTArr=SHL.bazi.shensha(riGan, riZhi, b.tgz.charAt(1));
      // 藏干
      var cgY=SHL.bazi.canggan(b.ygz.charAt(1));
      var cgM=SHL.bazi.canggan(b.mgz.charAt(1));
      var cgD=SHL.bazi.canggan(riZhi);
      var cgT=SHL.bazi.canggan(b.tgz.charAt(1));

      html+='<table class="bazi-table">';
      html+='<tr><th>四柱</th><th>年柱</th><th>月柱</th><th>日柱</th><th>时柱</th></tr>';
      html+='<tr><td>十神</td><td class="ss">'+esc(ssY)+'</td><td class="ss">'+esc(ssM)+'</td><td class="ss ri">日主</td><td class="ss">'+esc(ssT)+'</td></tr>';
      html+='<tr><td>天干</td><td class="gz">'+b.ygz.charAt(0)+'</td><td class="gz">'+b.mgz.charAt(0)+'</td><td class="gz red">'+riGan+'</td><td class="gz">'+b.tgz.charAt(0)+'</td></tr>';
      html+='<tr><td>地支</td><td class="gz">'+b.ygz.charAt(1)+'</td><td class="gz">'+b.mgz.charAt(1)+'</td><td class="gz red">'+riZhi+'</td><td class="gz">'+b.tgz.charAt(1)+'</td></tr>';
      html+='<tr><td>藏干</td><td class="cg">'+esc(cgY)+'</td><td class="cg">'+esc(cgM)+'</td><td class="cg">'+esc(cgD)+'</td><td class="cg">'+esc(cgT)+'</td></tr>';
      html+='<tr><td>纳音</td><td>'+b.yNayin+'</td><td>'+b.mNayin+'</td><td>'+b.dNayin+'</td><td>'+b.tNayin+'</td></tr>';
      html+='<tr><td>地势</td><td class="ds">'+esc(dsY)+'</td><td class="ds">'+esc(dsM)+'</td><td class="ds red">'+esc(dsD)+'</td><td class="ds">'+esc(dsT)+'</td></tr>';
      html+='<tr><td>神煞</td><td class="ss2">'+esc(ssYArr.join(' '))+'</td><td class="ss2">'+esc(ssMArr.join(' '))+'</td><td class="ss2 red">'+esc(ssDArr.join(' '))+'</td><td class="ss2">'+esc(ssTArr.join(' '))+'</td></tr>';
      html+='</table>';

      // 五行统计
      var wx=SHL.bazi.wuxingTongji(b);
      var wxTotal=wx.木+wx.火+wx.土+wx.金+wx.水;
      var dayWh=SHL.common.ganWh(riGan);
      var shengWh=SHL.const.sheng[dayWh]; // 生我的五行
      var tongWh=dayWh; // 同我五行
      var bornCount=wx[shengWh]+wx[tongWh]; // 帮身力量
      var weakStr = bornCount>=wxTotal/2 ? '偏强' : '偏弱';
      html+='<div class="wx-stat">';
      html+='<span class="wx-item wx-wood">木 '+wx.木+'</span>';
      html+='<span class="wx-item wx-fire">火 '+wx.火+'</span>';
      html+='<span class="wx-item wx-earth">土 '+wx.土+'</span>';
      html+='<span class="wx-item wx-metal">金 '+wx.金+'</span>';
      html+='<span class="wx-item wx-water">水 '+wx.水+'</span>';
      html+='<span class="wx-day">日主'+dayWh+' · '+weakStr+'</span>';
      html+='</div>';

      var pp='sex='+encodeURIComponent(sex==='男'?1:0)+
               '&year='+solarY+'&month='+solarM+'&day='+solarD+'&hour='+h+
               '&minute='+mi+'&cal='+calType+
               '&origY='+y+'&origM='+mo+'&origD='+d+
               '&leap='+(isLeap?1:0)+'&v='+Date.now();
      html+='<p class="center"><a class="btn" href="'+L.link('ppbazi/?'+pp)+'">查看完整八字排盘 →</a></p>';
      html+='</div>';
      r.innerHTML=html;
    }).catch(function(e){
      r.innerHTML='<div class="error">排盘数据加载失败：'+esc(e&&e.message?e.message:e)+'<br>请通过本地服务器预览（直接双击打开HTML文件无法加载数据，需用 <code>python -m http.server</code> 等启动本地服务；GitHub Pages 部署后可正常使用）。</div>';
    });
  };

  // 历法切换: 阴历时显示闰月选项; 并根据所选年月自动判断该月是否可能为闰月
  function updateLeapRow(){
    var isLunar=document.querySelector('input[name=caltype]:checked').value==='lunar';
    var leapRow=document.getElementById('leapRow');
    var leapChk=document.getElementById('f_leap');
    if(!isLunar){
      leapRow.style.display='none';
      leapChk.checked=false;
      return;
    }
    var y=parseInt(ySel.value), mo=parseInt(mSel.value);
    var monthNames=['正','二','三','四','五','六','七','八','九','十','冬','腊'];
    if(y && mo){
      var leap=SHL.common.lunar.leapMonth(y);
      // 仅当该年有闰月且当前选中的月恰好是闰月时，才允许勾选
      if(leap>0 && leap===mo){
        leapRow.style.display='';
        leapRow.querySelector('span').textContent='农历'+y+'年有闰'+monthNames[leap-1]+'月，可勾选表示排闰月';
      } else {
        leapRow.style.display='';
        leapChk.checked=false;
        if(leap>0){
          leapRow.querySelector('span').textContent='提示：农历'+y+'年的闰月为'+monthNames[leap-1]+'月，请切换到该月方可勾选闰月';
        } else {
          leapRow.querySelector('span').textContent='提示：农历'+y+'年无闰月，无需勾选';
        }
      }
    } else {
      leapRow.style.display='';
      leapRow.querySelector('span').textContent='仅当所选农历年该月有闰月时勾选';
    }
  }
  document.querySelectorAll('input[name=caltype]').forEach(function(r){
    r.onchange=updateLeapRow;
  });
  ySel.onchange=updateLeapRow;
  mSel.onchange=updateLeapRow;
})();
</script>
