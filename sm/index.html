<script>
(function(){
  SHL.layout.setTitle('免费在线算命');
  var now=new Date();
  var ySel=document.getElementById('f_year'),mSel=document.getElementById('f_month'),dSel=document.getElementById('f_day'),hSel=document.getElementById('f_hour'),minSel=document.getElementById('f_min');
  for(var y=1940;y<=now.getFullYear();y++){ ySel.add(new Option(y,y)); }
  for(var m=1;m<=12;m++){ mSel.add(new Option(m,m)); }
  for(var d=1;d<=31;d++){ dSel.add(new Option(d,d)); }
  for(var h=0;h<=23;h++){ hSel.add(new Option(SHL.const.dizhiHour(h)+' '+h+'时',h)); }
  for(var mi=0;mi<=59;mi++){ minSel.add(new Option(mi,mi)); }
  ySel.value=1990; mSel.value=now.getMonth()+1; dSel.value=now.getDate(); hSel.value=12;

  // 子模块网格
  var items=[
    {n:'生辰八字',u:'sm-1.html',ic:'八'},
    {n:'八字测算',u:'sm-2.html',ic:'测'},
    {n:'日干论命',u:'sm-3.html',ic:'日'},
    {n:'称骨论命',u:'sm-4.html',ic:'骨'},
    {n:'姓名测试',u:'sm-5.html',ic:'姓'},
    {n:'姓名配对',u:'sm-6.html',ic:'配'},
    {n:'上辈为人',u:'sm-7.html',ic:'前'},
    {n:'姓氏起源',u:'sm-8.html',ic:'氏'},
    {n:'身体保健',u:'baojian.html',ic:'健'},
    {n:'EQ曲线',u:'eq.html',ic:'EQ'},
    {n:'五大建议',u:'wu.html',ic:'议'},
    {n:'IQ揭密',u:'iq.html',ic:'IQ'},
    {n:'失败剖析',u:'shibai.html',ic:'败'},
    {n:'星座名人',u:'mingren.html',ic:'名'}
  ];
  var g=document.getElementById('smGrid'); var h='';
  for(var i=0;i<items.length;i++){
    h+='<a href="'+items[i].u+'"><span class="ic">'+items[i].ic+'</span><span class="nm">'+items[i].n+'</span></a>';
  }
  g.innerHTML=h;

  // 提交：带参数跳转到 sm-1.html
  document.getElementById('smBtn').onclick=function(){
    var xing=document.getElementById('f_xing').value.trim();
    var ming=document.getElementById('f_ming').value.trim();
    var sex=document.getElementById('f_sex').value;
    var y=ySel.value, m=mSel.value, d=dSel.value, hh=hSel.value, mi=minSel.value;
    var blood=document.getElementById('f_blood').value;
    if(!xing){ alert('请输入您的姓氏'); document.getElementById('f_xing').focus(); return; }
    if(xing.length<1||xing.length>2){ alert('姓氏应在1-2个字之间'); return; }
    if(!ming){ alert('请输入您的名字'); document.getElementById('f_ming').focus(); return; }
    if(ming.length<1||ming.length>2){ alert('名字应在1-2个字之间'); return; }
    if(!sex){ alert('请选择您的性别'); document.getElementById('f_sex').focus(); return; }
    if(!y||!m||!d||hh===''){ alert('请填写完整的出生时间'); return; }
    var p='?y='+encodeURIComponent(y)+'&m='+encodeURIComponent(m)+'&d='+encodeURIComponent(d)+'&h='+encodeURIComponent(hh)+'&mi='+encodeURIComponent(mi);
    p+='&n='+encodeURIComponent(xing+ming)+'&s='+encodeURIComponent(sex);
    if(blood) p+='&b='+encodeURIComponent(blood);
    location.href='sm-1.html'+p;
  };
})();
