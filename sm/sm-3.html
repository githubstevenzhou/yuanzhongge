<body>
<div id="site-header"></div>
<main><div class="container">
  <div class="page-head"><h1>日干论命</h1><div class="desc">根据八字日柱分析性格、爱情、事业、财运、健康。</div></div>
  <div id="formBox"></div>
  <div id="result"></div></div></main>
<div id="site-footer"></div>
<script src="../assets/js/lib/constants.js"></script>
<script src="../assets/js/lib/common.js"></script>
<script src="../assets/js/lib/data.js"></script>
<script src="../assets/js/lib/bazi.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
(function(){
  SHL.layout.setTitle('日干论命');
  var qs=SHL.common.qs, esc=SHL.layout.esc, C=SHL.const;
  function pad(n){ return String(n).padStart(2,'0'); }
  function constellation(month,day){
    var d=[[1,20,'摩羯','水瓶'],[2,19,'水瓶','双鱼'],[3,21,'双鱼','白羊'],[4,21,'白羊','金牛'],
      [5,21,'金牛','双子'],[6,22,'双子','巨蟹'],[7,23,'巨蟹','狮子'],[8,23,'狮子','处女'],
      [9,23,'处女','天秤'],[10,23,'天秤','天蝎'],[11,22,'天蝎','射手'],[12,22,'射手','摩羯']];
    for(var i=0;i<12;i++){ if(month===d[i][0]) return day<d[i][1]?d[i][2]:d[i][3]; }
    return '摩羯';
  }
  function navButtons(cur){
    var items=[['生辰八字','sm-1.html'],['八字测算','sm-2.html'],['日干论命','sm-3.html'],['称骨论命','sm-4.html'],
      ['姓名测试','sm-5.html'],['姓名配对','sm-6.html'],['上辈为人','sm-7.html'],['姓氏起源','sm-8.html'],
      ['身体保健','baojian.html'],['EQ曲线','eq.html'],['五大建议','wu.html'],['IQ揭密','iq.html'],['失败剖析','shibai.html'],['星座名人','mingren.html']];
    var h='<div class="panel"><div style="display:flex;flex-wrap:wrap;gap:6px">';
    for(var i=0;i<items.length;i++){
      h+='<a class="btn" style="font-size:13px;padding:6px 12px'+(items[i][0]===cur?';background:#d4a017;color:#3a1f0a':'')+'" href="'+items[i][1]+location.search+'">'+esc(items[i][0])+'</a>';
    }
    h+='</div></div>'; return h;
  }
  function buildForm(){
    var now=new Date();
    var ys='<select id="f_year">';for(var y=1940;y<=now.getFullYear();y++){ys+='<option value="'+y+'">'+y+'</option>';}ys+='</select>';
    var ms='<select id="f_month">';for(var m=1;m<=12;m++){ms+='<option value="'+m+'">'+m+'</option>';}ms+='</select>';
    var ds='<select id="f_day">';for(var d=1;d<=31;d++){ds+='<option value="'+d+'">'+d+'</option>';}ds+='</select>';
    var hs='<select id="f_hour">';for(var h=0;h<=23;h++){hs+='<option value="'+h+'">'+C.dizhiHour(h)+' '+h+'时</option>';}hs+='</select>';
    var f='<div class="panel"><h2>输入资料</h2><form id="bzForm" onsubmit="return false">'+
      '<div class="form-row"><label>姓名</label><div class="ctrl"><input type="text" id="f_name" style="max-width:140px"></div></div>'+
      '<div class="form-row"><label>性别</label><div class="ctrl"><select id="f_sex"><option value="男">男</option><option value="女">女</option></select></div></div>'+
      '<div class="form-row"><label>出生时间</label><div class="ctrl" style="display:flex;gap:6px;flex-wrap:wrap">'+ys+'<span>年</span>'+ms+'<span>月</span>'+ds+'<span>日</span>'+hs+'<span>时</span></div></div>'+
      '<div class="form-row"><label></label><div class="ctrl"><button class="btn btn-gold" id="goBtn">开始论命</button></div></div></form></div>';
    document.getElementById('formBox').innerHTML=f;
    document.getElementById('f_year').value=1990;document.getElementById('f_month').value=now.getMonth()+1;
    document.getElementById('f_day').value=now.getDate();document.getElementById('f_hour').value=12;
    document.getElementById('goBtn').onclick=function(){
      var name=document.getElementById('f_name').value.trim();
      if(!name){alert('请输入姓名');return;}
      var p='?y='+document.getElementById('f_year').value+'&m='+document.getElementById('f_month').value+'&d='+document.getElementById('f_day').value;
      p+='&h='+document.getElementById('f_hour').value+'&mi=0&n='+encodeURIComponent(name)+'&s='+encodeURIComponent(document.getElementById('f_sex').value);
      location.href='sm-3.html'+p;
    };
  }

  var y=parseInt(qs('y')),m=parseInt(qs('m')),d=parseInt(qs('d')),h=parseInt(qs('h')),mi=parseInt(qs('mi'))||0;
  var name=qs('n'),sex=qs('s');
  if(!y||!m||!d||isNaN(h)||!name){ buildForm(); return; }

  var r=document.getElementById('result');
  r.innerHTML='<div class="loading">正在分析...</div>'+navButtons('日干论命');

  Promise.all([
    SHL.data.load('calendar_jq'), SHL.data.load('calendar_stime'),
    SHL.data.load('senlon_rgnm'), SHL.data.load('senlon_sxgx')
  ]).then(function(arr){
    var jq=arr[0].terms, st=arr[1].items;
    var rgnmData=arr[2].rows, sxgxData=arr[3].rows;
    var b=SHL.bazi.calc({year:y,month:m,day:d,hour:h,minute:mi,longitude:120}, jq, st);
    var dg1=b.dgz.charAt(0), dWh=SHL.common.ganWh(dg1);
    var xingzuo=constellation(m,d);

    var rgnmRow=null; for(var i=0;i<rgnmData.length;i++){ if(rgnmData[i].rgz===b.dgz){rgnmRow=rgnmData[i];break;} }
    var sxgxRow=null; for(var i=0;i<sxgxData.length;i++){ if(sxgxData[i].sx===b.shengxiao){sxgxRow=sxgxData[i];break;} }

    // 五行个数
    var bzwh=b.ygzWh+b.mgzWh+b.dgzWh+b.tgzWh;
    var wn={金:0,木:0,水:0,火:0,土:0};
    for(var i=0;i<bzwh.length;i++){ if(wn[bzwh[i]]!==undefined) wn[bzwh[i]]++; }
    var mainw='',mainq='';
    for(var k in wn){ if(wn[k]>=3) mainw+='<strong>'+k+'</strong>旺'; if(wn[k]===0) mainq+='缺<strong>'+k+'</strong>'; }

    var html='<div class="panel"><h2>日干论命结果</h2><div class="result-box">';
    html+='<p><b>姓名：</b><span class="red">'+esc(name)+'</span>　<b>性别：</b>'+esc(sex)+'</p>';
    html+='<p><b>出生：</b><span class="gold">'+y+'年'+m+'月'+d+'日 '+pad(h)+'时</span>　<b>生肖：</b>'+b.shengxiao+'　<b>星座：</b>'+xingzuo+'</p>';
    html+='</div>';

    // 简表
    html+='<table class="bazi-table">';
    html+='<tr><th>四柱</th><th>年柱</th><th>月柱</th><th>日柱</th><th>时柱</th></tr>';
    html+='<tr><td>干支</td><td class="gz">'+b.ygz+'</td><td class="gz">'+b.mgz+'</td><td class="gz red">'+b.dgz+'</td><td class="gz">'+b.tgz+'</td></tr>';
    html+='<tr><td>纳音</td><td>'+b.yNayin+'</td><td>'+b.mNayin+'</td><td>'+b.dNayin+'</td><td>'+b.tNayin+'</td></tr>';
    html+='<tr><td>五行</td><td>'+b.ygzWh+'</td><td>'+b.mgzWh+'</td><td>'+b.dgzWh+'</td><td>'+b.tgzWh+'</td></tr>';
    html+='</table>';

    html+='<div class="result-box"><p>本命属'+b.shengxiao+'，'+SHL.common.layin(b.ygz)+'命。五行'+mainw+mainq+'；日主天干为<b>'+dWh+'</b>。';
    html+='<br>八字五行个数：'+wn.金+'个金，'+wn.木+'个木，'+wn.水+'个水，'+wn.火+'个火，'+wn.土+'个土</p></div>';

    if(sxgxRow){
      html+='<div class="result-box"><p><b>生肖个性：</b>您的生肖为"'+b.shengxiao+'"<br>'+sxgxRow.sxgx+'</p></div>';
    }
    if(rgnmRow){
      if(rgnmRow.xgfx) html+='<div class="result-box"><h3>性格分析</h3><p>'+rgnmRow.xgfx+'</p></div>';
      if(rgnmRow.aqfx) html+='<div class="result-box"><h3>爱情分析</h3><p>'+rgnmRow.aqfx+'</p></div>';
      if(rgnmRow.syfx) html+='<div class="result-box"><h3>事业分析</h3><p>'+rgnmRow.syfx+'</p></div>';
      if(rgnmRow.cyfx) html+='<div class="result-box"><h3>财运分析</h3><p>'+rgnmRow.cyfx+'</p></div>';
      if(rgnmRow.jkfx) html+='<div class="result-box"><h3>健康分析</h3><p>'+rgnmRow.jkfx+'</p></div>';
    }
    html+='<div class="result-box"><p class="muted">说明：日干论命仅对八字中日柱的信息进行分析，为片面的信息，仅供参考！</p></div>';

    html+='<p class="center" style="margin-top:14px"><a class="btn" href="index.html">返回算命首页</a></p>';
    html+='</div>';
    r.innerHTML=navButtons('日干论命')+html;
  }).catch(function(e){
    r.innerHTML=navButtons('日干论命')+'<div class="error">数据加载失败：'+esc(e.message)+'</div>';
  });
})();
</script>
</body></html>
