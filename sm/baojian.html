<script>
(function(){
  SHL.layout.setTitle('身体保健');
  var qs=SHL.common.qs, esc=SHL.layout.esc, C=SHL.const;
  function constellation(month,day){
    var d=[[1,20,'摩羯','水瓶'],[2,19,'水瓶','双鱼'],[3,21,'双鱼','白羊'],[4,21,'白羊','金牛'],
      [5,21,'金牛','双子'],[6,22,'双子','巨蟹'],[7,23,'巨蟹','狮子'],[8,23,'狮子','处女'],
      [9,23,'处女','天秤'],[10,23,'天秤','天蝎'],[11,22,'天蝎','射手'],[12,22,'射手','摩羯']];
    for(var i=0;i<12;i++){ if(month===d[i][0]) return day<d[i][1]?d[i][2]:d[i][3]; }
    return '摩羯';
  }
  function navButtons(cur){
    var items=[['生辰八字','sm-1.html'],['八字测算','sm-2.html'],['日干论命','sm-3.html'],['称骨论命','sm-4.html'],
      ['姓名测试','sm-5.html'],['姓名配对','sm-6.html'],['上辈为人','sm-7.html'],['姓氏起源','sm-8.html'],
      ['身体保健','baojian.html'],['EQ曲线','eq.html'],['五大建议','wu.html'],['IQ揭密','iq.html'],['失败剖析','shibai.html'],['星座名人','mingren.html']];
    var h='<div class="panel"><div style="display:flex;flex-wrap:wrap;gap:6px">';
    for(var i=0;i<items.length;i++){
      h+='<a class="btn" style="font-size:13px;padding:6px 12px'+(items[i][0]===cur?';background:#d4a017;color:#3a1f0a':'')+'" href="'+items[i][1]+location.search+'">'+esc(items[i][0])+'</a>';
    }
    h+='</div></div>'; return h;
  }

  var name=qs('n'), y=qs('y'), m=qs('m'), d=qs('d');
  if(!y||!m||!d){
    var now=new Date();
    var ys='<select id="f_year">';for(var yr=1940;yr<=now.getFullYear();yr++){ys+='<option value="'+yr+'">'+yr+'</option>';}ys+='</select>';
    var ms='<select id="f_month">';for(var mo=1;mo<=12;mo++){ms+='<option value="'+mo+'">'+mo+'</option>';}ms+='</select>';
    var ds='<select id="f_day">';for(var dd=1;dd<=31;dd++){ds+='<option value="'+dd+'">'+dd+'</option>';}ds+='</select>';
    var f='<div class="panel"><h2>查询星座</h2><form id="bjForm" onsubmit="return false">'+
      '<div class="form-row"><label>姓名</label><div class="ctrl"><input type="text" id="f_name" style="max-width:140px"></div></div>'+
      '<div class="form-row"><label>公历生日</label><div class="ctrl" style="display:flex;gap:6px;flex-wrap:wrap">'+ys+'<span>年</span>'+ms+'<span>月</span>'+ds+'<span>日</span></div></div>'+
      '<div class="form-row"><label></label><div class="ctrl"><button class="btn btn-gold" id="goBtn">查询</button></div></div></form></div>';
    document.getElementById('result').innerHTML=navButtons('身体保健')+f;
    document.getElementById('f_year').value=1990;document.getElementById('f_month').value=now.getMonth()+1;
    document.getElementById('f_day').value=now.getDate();
    document.getElementById('goBtn').onclick=function(){
      var p='?y='+document.getElementById('f_year').value+'&m='+document.getElementById('f_month').value+'&d='+document.getElementById('f_day').value;
      var nm=document.getElementById('f_name').value.trim(); if(nm) p+='&n='+encodeURIComponent(nm);
      location.href='baojian.html'+p;
    };
    return;
  }

  var r=document.getElementById('result');
  r.innerHTML='<div class="loading">正在查询...</div>'+navButtons('身体保健');
  var xz=constellation(parseInt(m),parseInt(d));
  SHL.data.load('senlon_baojian').then(function(d){
    var rows=d.rows, row=null;
    for(var i=0;i<rows.length;i++){ if(rows[i].title===xz){ row=rows[i]; break; } }
    var html='<div class="panel"><h2>'+esc(name||'')+'的星座身体保健</h2><div class="result-box">';
    html+='<p><b>姓名：</b>'+esc(name||'未输入')+'　<b>出生：</b>'+y+'-'+m+'-'+d+'　<b>星座：</b><span class="red">'+xz+'座</span></p>';
    html+='</div>';
    html+='<div class="result-box"><h3>'+xz+'座之身体保健</h3>';
    html+='<p>'+(row?row.content:'暂无资料')+'</p></div>';
    html+='<p class="center" style="margin-top:14px"><a class="btn" href="index.html">返回算命首页</a></p></div>';
    r.innerHTML=navButtons('身体保健')+html;
  }).catch(function(e){
    r.innerHTML=navButtons('身体保健')+'<div class="error">数据加载失败：'+esc(e.message)+'</div>';
  });
})();
