<body>
<div id="site-header"></div>
<main><div class="container">
  <div class="page-head"><h1>姓名五格配对</h1><div class="desc">依据姓名笔画数计算五格数理，运用阴阳五行相生相克推算双方配对缘分。</div></div>

  <div class="panel">
    <h2>姓名五格配对简介</h2>
    <div class="desc" style="line-height:1.9">
      <p>姓名五格配对是根据《易经》的“象”、“数”理论，依据姓名的笔画数和一定规则建立起来的天格、地格、人格、总格、外格等五格数理关系，并运用阴阳五行相生相克理论，来推算各方面运势与配对缘分。</p></div></div>

  <div class="panel">
    <h2>配对测试</h2>
    <form id="wgForm" onsubmit="return false">
      <div class="form-row">
        <label>您的姓名</label>
        <div class="ctrl">
          <input type="text" id="name1" maxlength="4" placeholder="2-4个简体汉字" style="max-width:160px;font-size:18px;letter-spacing:4px" autocomplete="off">
          <select id="xing1" style="margin-left:8px"><option value="1">单姓</option><option value="2">复姓</option></select>
          <select id="sex1" style="margin-left:6px"><option value="男">男性</option><option value="女">女性</option></select></div></div>
      <div class="form-row">
        <label>对方姓名</label>
        <div class="ctrl">
          <input type="text" id="name2" maxlength="4" placeholder="2-4个简体汉字" style="max-width:160px;font-size:18px;letter-spacing:4px" autocomplete="off">
          <select id="xing2" style="margin-left:8px"><option value="1">单姓</option><option value="2">复姓</option></select>
          <select id="sex2" style="margin-left:6px"><option value="男">男性</option><option value="女" selected>女性</option></select></div></div>
      <div class="form-row"><label></label><div class="ctrl"><button class="btn btn-gold" id="wgBtn">开始测试</button></div></div>
    </form>
    <div id="result"></div></div></div></main>
<div id="site-footer"></div>
<script src="../assets/js/lib/data.js"></script>
<script src="../assets/js/layout.js?v=20261009b"></script>
<script>
(function(){
  SHL.layout.setTitle('姓名五格配对');
  var L=SHL.layout;
  function esc(s){ return L.esc(s); }
  function br(s){ return esc(s).replace(/\r\n|\n|\r/g,'<br>'); }

  // 仅汉字
  function bindFilter(el){ el.oninput=function(){ this.value=this.value.replace(/[^\u4E00-\u9FA5]/g,''); }; }
  bindFilter(document.getElementById('name1'));
  bindFilter(document.getElementById('name2'));

  // 笔画索引
  var bihuaMap=null, rows81=null, sancaiRows=null;
  function ensureData(){
    var p1=bihuaMap?Promise.resolve():SHL.data.rows('senlon_bihua').then(function(rows){
      bihuaMap={};
      for(var i=0;i<rows.length;i++){ var n=parseInt(rows[i].num);var s=rows[i].hanzi||'';for(var k=0;k<s.length;k++)bihuaMap[s.charAt(k)]=n; }
    });
    var p2=rows81?Promise.resolve():SHL.data.rows('senlon_81').then(function(rows){ rows81=rows; });
    var p3=sancaiRows?Promise.resolve():SHL.data.rows('senlon_sancai').then(function(rows){ sancaiRows=rows; });
    return Promise.all([p1,p2,p3]);
  }
  function bihua(ch){ return bihuaMap[ch]; }
  function reduce81(n){ while(n>80)n-=80; return n; } // 81数理: 大于80者减80(81->1)
  function find81(num){ if(!rows81)return null; var n=String(reduce81(num)); for(var i=0;i<rows81.length;i++){ if(rows81[i].num===n)return rows81[i]; } return null; }
  function findSancai(title){ if(!sancaiRows)return null; for(var i=0;i<sancaiRows.length;i++){ if(sancaiRows[i].title===title)return sancaiRows[i]; } return null; }

  // 数理尾数 -> 五行 (1,2木;3,4火;5,6土;7,8金;9,0水)
  function numWh(num){ var d=num%10; if(d===1||d===2)return '木'; if(d===3||d===4)return '火'; if(d===5||d===6)return '土'; if(d===7||d===8)return '金'; return '水'; }
  // 吉凶 -> 评分值 (越小越吉)
  function pf(jx){ if(jx==='大吉')return 1; if(jx==='吉')return 2; if(jx==='半吉')return 3; if(jx==='平')return 3; if(jx==='凶')return 4; if(jx==='大凶')return 5; return 3; }
  function jxCls(jx){ return {'大吉':'wg-jx-daji','吉':'wg-jx-ji','半吉':'wg-jx-banji','平':'wg-jx-ping','凶':'wg-jx-xiong','大凶':'wg-jx-daxiong'}[jx]||'wg-jx-ping'; }

  // 计算单名五格: {chars:[{ch,bihua,wh}], tian,ren,di,zong,wai, sancaiTitle}
  function calcName(name,xing){
    var chars=[];
    for(var i=0;i<name.length;i++){
      var ch=name.charAt(i);
      var b=bihua(ch);
      if(b==null)b=0; // 未找到笔画按0处理(理论上前面已校验)
      chars.push({ch:ch,bihua:b,wh:numWh(b)});
    }
    // 姓部分
    var b1=chars[0].bihua, b2=0;
    var xingCount = (xing==='2')?2:1;
    if(xing==='2'&&chars[1])b2=chars[1].bihua;
    // 名部分
    var mingStart=xingCount;
    var b3=chars[mingStart]?chars[mingStart].bihua:0;
    var b4=chars[mingStart+1]?chars[mingStart+1].bihua:0;

    var tian, ren, di, zong, wai;
    // 天格
    tian = (xing==='2')? (b1+b2) : (b1+1);
    // 人格
    ren = (xing==='2')? (b2+b3) : (b1+b3);
    // 地格
    di = chars[mingStart+1]? (b3+b4) : (b3+1);
    // 总格
    zong = b1+b2+b3+b4;
    // 外格
    wai = zong - ren;
    if(xing!=='2')wai += 1; // 单姓 +1
    if(!chars[mingStart+1])wai += 1; // 单字名 +1

    var sancaiTitle = numWh(tian)+numWh(ren)+numWh(di);
    return {chars:chars,tian:tian,ren:ren,di:di,zong:zong,wai:wai,sancaiTitle:sancaiTitle};
  }

  function geRow(name,label,ge){
    var r81=find81(ge);
    var jx=r81?r81.jx:'';
    var yy=r81?r81.yy:'';
    var wh=numWh(ge);
    var h='<tr><td class="gname">'+label+'</td>';
    h+='<td><span class="wg-ge">'+ge+'</span></td>';
    h+='<td>'+wh+'</td>';
    h+='<td class="'+jxCls(jx)+'">'+esc(jx)+'</td>';
    h+='<td style="text-align:left;font-size:12px;color:#7a5a38">'+esc(yy)+'</td>';
    h+='</tr>';
    return h;
  }

  function renderNameBlock(g,name,sex){
    var h='<table class="wg-table"><tr><th>字</th><th>笔画</th><th>五行</th></tr>';
    for(var i=0;i<g.chars.length;i++){
      h+='<tr><td style="font-size:18px">'+esc(g.chars[i].ch)+'</td><td>'+g.chars[i].bihua+'</td><td>'+g.chars[i].wh+'</td></tr>';
    }
    h+='</table>';
    h+='<table class="wg-table" style="margin-top:10px">';
    h+='<tr><th>五格</th><th>数理</th><th>五行</th><th>吉凶</th><th>含义</th></tr>';
    h+=geRow(g,'天格',g.tian);
    h+=geRow(g,'人格',g.ren);
    h+=geRow(g,'地格',g.di);
    h+=geRow(g,'外格',g.wai);
    h+=geRow(g,'总格',g.zong);
    h+='</table>';
    var sc=findSancai(g.sancaiTitle);
    h+='<p style="margin-top:8px"><b>三才配置：</b><span style="color:#0066cc">'+esc(g.sancaiTitle)+'</span>';
    if(sc){ h+='（<span class="'+jxCls(sc.jx)+'">'+esc(sc.jx)+'</span>）'; }
    h+='</p>';
    if(sc&&sc.xg){ h+='<p style="line-height:1.9;font-size:13px;color:#5a3a18">'+br(sc.xg)+'</p>'; }
    return h;
  }

  function calc(){
    var n1=document.getElementById('name1').value.trim();
    var n2=document.getElementById('name2').value.trim();
    if(!n1||n1.length<2){ alert('请输入您的姓名（2-4个汉字）');return; }
    if(!n2||n2.length<2){ alert('请输入对方姓名（2-4个汉字）');return; }
    var xing1=document.getElementById('xing1').value;
    var xing2=document.getElementById('xing2').value;
    // 复姓需 >=3 字
    if(xing1==='2'&&n1.length<3){ alert('复姓姓名至少需3个字');return; }
    if(xing2==='2'&&n2.length<3){ alert('复姓姓名至少需3个字');return; }
    // 检查笔画库
    var r=document.getElementById('result');
    r.innerHTML='<div class="loading">正在测算...</div>';
    ensureData().then(function(){
      // 校验所有字笔画
      function missing(name){ var m=[]; for(var i=0;i<name.length;i++){ if(bihua(name.charAt(i))==null)m.push(name.charAt(i)); } return m; }
      var m1=missing(n1),m2=missing(n2);
      if(m1.length||m2.length){
        r.innerHTML='<div class="error">笔画库中未找到汉字：'+esc((m1.concat(m2)).join(' '))+'，请尝试常用汉字。</div>';
        return;
      }
      var g1=calcName(n1,xing1), g2=calcName(n2,xing2);
      var sex1=document.getElementById('sex1').value, sex2=document.getElementById('sex2').value;

      // 评分
      var n1d=Math.abs(pf(find81(g1.tian).jx)-pf(find81(g2.tian).jx));
      var n2d=Math.abs(pf(find81(g1.ren).jx)-pf(find81(g2.ren).jx));
      var n3d=Math.abs(pf(find81(g1.di).jx)-pf(find81(g2.di).jx));
      var n4d=Math.abs(pf(find81(g1.zong).jx)-pf(find81(g2.zong).jx));
      var n5d=Math.abs(pf(find81(g1.wai).jx)-pf(find81(g2.wai).jx));
      var zf=Math.round(100-((n1d+n2d+n3d)+(n4d+n5d)/5));
      if(zf<0)zf=0; if(zf>100)zf=100;

      var h='<div class="result-box">';
      h+='<p><b>['+esc(n1)+']</b>（'+esc(sex1)+'）与 <b>['+esc(n2)+']</b>（'+esc(sex2)+'）的姓名五格配对分析如下：</p>';

      h+='<h3 style="color:#cc6600">姓名一：'+esc(n1)+'</h3>'+renderNameBlock(g1);
      h+='<h3 style="color:#cc6600;margin-top:18px">姓名二：'+esc(n2)+'</h3>'+renderNameBlock(g2);

      h+='<div class="score-box">';
      h+='<div style="font-size:14px;color:#8a6a48">姓名缘分指数</div>';
      h+='<div class="score-num">'+zf+'</div>';
      var msg='';
      if(sex1===sex2){
        msg='<font color="#d4450f">本站按中国民俗学方法计算，暂时不支持同性缘份测试。</font>';
      }else if(zf<60){
        msg='<font color="#5a8a3a">你们的姓名五格可能不是太合，不过八字配合所起的作用更大，另外彼此的努力也会让你们改善关系，记住：事在人为！</font>';
      }else if(zf<70){
        msg='<font color="#5a8a3a">你们的姓名五格相合程度马马虎虎，不过八字配合所起的作用更大，继续努力改善关系，会对你们的关系有帮助的！</font>';
      }else if(zf<80){
        msg='<font color="#5a8a3a">你们的姓名五格相合程度还不错哟！</font>';
      }else if(zf<90){
        msg='<font color="#5a8a3a">你们的姓名五格相合程度相当棒！</font>';
      }else{
        msg='<font color="#5a8a3a">你们的姓名五格相合程度太棒了！！恭喜！</font>';
        if(n1===n2)msg+='<br><font color="#0066cc">^_^ 你们俩同名同姓嘛，真巧哟！</font>';
      }
      h+='<div style="margin-top:8px;font-size:14px">'+msg+'</div>';
      h+='</div>';
      h+='';
      h+='</div>';
      r.innerHTML=h;
    }).catch(function(e){
      r.innerHTML='<div class="error">数据加载失败：'+esc(e.message)+'</div>';
    });
  }

  document.getElementById('wgBtn').onclick=calc;
})();
</script>
