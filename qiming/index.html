<body>
<div id="site-header"></div>
<main><div class="container">
  <div class="page-head"><h1>免费在线起名</h1><div class="desc">输入姓氏、选择性别，依吉利笔画组合从字库生成姓名候选，可反复生成。</div></div>

  <div class="panel">
    <h2>起名器说明</h2>
    <div class="desc" style="line-height:1.9">
      <p>原版为 Flash 起名器，本页以纯 JS 改写。生成器内置数百常见姓氏与按笔画分组的汉字库，可产生大量姓名候选。依姓氏笔画查得起名笔画组合模板，再从对应笔画的字库中随机选字组合成姓名，不断点击可生成更多候选。</p>
      <p style="color:#8a6a48">注：笔画以康熙字典为准，结果仅供起名参考。</p></div></div>

  <div class="panel">
    <h2>开始起名</h2>
    <form id="qmForm" onsubmit="return false">
      <div class="form-row"><label>姓氏</label><div class="ctrl">
        <input type="text" id="surname" list="surnameList" maxlength="2" placeholder="输入或选择姓氏（1-2字）" autocomplete="off" style="max-width:160px">
        <datalist id="surnameList"></datalist></div></div>
      <div class="form-row"><label>性别</label><div class="ctrl">
        <label style="margin-right:18px"><input type="radio" name="qmSex" value="男" checked> 男名</label>
        <label><input type="radio" name="qmSex" value="女"> 女名</label></div></div>
      <div class="form-row"><label></label><div class="ctrl">
        <button class="btn btn-gold" id="qmBtn" type="button">生成名字</button>
        <button class="btn" id="qmMoreBtn" type="button" style="margin-left:8px;display:none">再来一组</button></div></div>
    </form>
    <div id="result"></div></div></div></main>

<script src="../assets/js/lib/data.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
(function(){
  SHL.layout.setTitle('免费在线起名');
  var L=SHL.layout;
  function esc(s){ return L.esc(s); }

  // ===== 常见姓氏列表（按康熙笔画排序，用于 datalist 提示） =====
  var SURNAMES = ('赵钱孙李周吴郑王冯陈褚卫蒋沈韩杨朱秦尤许何吕施张孔曹严华金魏陶姜戚谢邹喻柏水窦章云苏潘葛奚范彭郎鲁韦昌马苗凤花方俞任袁柳鲍史唐费廉岑薛雷贺倪汤滕殷罗毕郝邬安常乐于时傅皮卞齐康伍余元卜顾孟平黄和穆萧尹姚邵湛汪祁毛禹狄米贝明臧计伏成戴谈宋茅庞熊纪舒屈项祝董梁杜阮蓝闵席季麻强贾路娄危江童颜郭梅盛林刁钟徐邱骆高夏蔡田樊胡凌霍虞万支柯昝管卢莫经房裘缪干解应宗丁宣贲邓郁单杭洪包诸左石崔吉钮龚程嵇邢滑裴陆荣翁荀羊於惠甄曲家封芮羿储靳汲邴糜松井段富巫乌焦巴弓牧隗山谷车侯宓蓬全郗班仰秋仲伊宫宁仇栾暴甘钭厉戎祖武符刘景詹束龙叶幸司韶郜黎蓟薄印宿白怀蒲邰从鄂索咸籍赖卓蔺屠蒙池乔阴郁胥能苍双闻申党翟谭贡劳逄姬申扶堵冉宰郦雍却璩桑桂濮牛寿通边扈燕冀郏浦尚农温别庄晏柴瞿阎充慕连茹习宦艾鱼容向古易慎戈廖庾终暨居衡步都耿满弘匡国文寇广禄阙东欧殳沃利蔚越夔隆师巩厍聂晁勾敖融冷訾辛阚那简饶空曾毋沙乜养鞠须丰巢关蒯相查后荆红游竺权逯盖益桓公').split('');

  // ===== 男名常用字集合（用于按性别筛选，笔画由 bihua 库决定） =====
  var MALE_CHARS = '力丁乃山川大子千之文元中天夫太友仁旭立正石白永平玉世光全伟争先同宇志宏良辰佑利君希明昌建国东林杰昆昊亮勇飞春星泰帝政健哲峰强刚伦凌彪晗晨朗焕翔祥梁智皓凯胜朝景焜炜熙楠楷靖驰圣嘉宁睿荣源溢慕德磊庆赋毅震霆锋钦浩瀚鹏辰涛润琛博钧'.split('');
  // ===== 女名常用字集合 =====
  var FEMALE_CHARS = '女子夕朵月云丹方心巧兰宁玲可永冉竹祁安冰如妆字帆妍妙妤姝孝彤杏芷佳妹姐妮姗婷岚怡思美柔春柯染娜娟娘娣娓娱恬芳曼晗晨玲珊翎苗英媛媚婷愉棠棉晴景婧媳琬琳琴照熙诗嫣嫦嘉慕慈玮婵娇慧影漫樱瑶琼璐莹颖梦雅琪茹薇菁蓓倩蕊婷悦欢宁静彤雯'.split('');

  // 姓氏下拉填充
  var dl=document.getElementById('surnameList');
  var seen={};
  for(var i=0;i<SURNAMES.length;i++){
    var ch=SURNAMES[i];
    if(ch && !seen[ch]){
      seen[ch]=1;
      var o=document.createElement('option');
      o.value=ch;
      dl.appendChild(o);
    }
  }
  // 仅允许汉字
  var surInp=document.getElementById('surname');
  surInp.oninput=function(){ this.value=this.value.replace(/[^\u4E00-\u9FA5]/g,''); };

  var bihuaMap=null, qimingRows=null;
  function ensureData(){
    var p1 = bihuaMap ? Promise.resolve() :
      SHL.data.rows('senlon_bihua').then(function(rows){
        bihuaMap={};
        for(var i=0;i<rows.length;i++){
          var n=parseInt(rows[i].num,10);
          var s=rows[i].hanzi||'';
          for(var k=0;k<s.length;k++){
            var c=s.charAt(k);
            if(!bihuaMap[c]) bihuaMap[c]=n; // 首次出现即记录（一字可能在多个笔画组，取首次）
          }
        }
      });
    var p2 = qimingRows ? Promise.resolve() :
      SHL.data.rows('senlon_qiming').then(function(rows){ qimingRows=rows; });
    return Promise.all([p1,p2]);
  }

  // 按笔画取字库字符串
  var bihuaRows=null;
  function ensureBihuaRows(){
    if(bihuaRows) return Promise.resolve(bihuaRows);
    return SHL.data.rows('senlon_bihua').then(function(rows){ bihuaRows=rows; return rows; });
  }
  function charsByStrokes(n){
    if(!bihuaRows) return '';
    for(var i=0;i<bihuaRows.length;i++){
      if(parseInt(bihuaRows[i].num,10)===n) return bihuaRows[i].hanzi||'';
    }
    return '';
  }

  // 查 qiming 模板：姓氏ID = 姓氏笔画
  function findTemplate(bihua){
    if(!qimingRows) return null;
    var key=String(bihua);
    for(var i=0;i<qimingRows.length;i++){
      if(String(qimingRows[i]['姓氏'])===key) return qimingRows[i];
    }
    return null;
  }

  // 解析模板内容为 6 组 [a, b] 笔画组合
  function parseTemplate(content){
    if(!content) return [];
    // 兼容 - 与 , 分隔
    var parts=String(content).split(/[-,，]/);
    var list=[];
    for(var i=0;i<parts.length;i++){
      var p=parts[i].trim();
      if(p.length!==4) continue;
      var a=parseInt(p.substring(0,2),10), b=parseInt(p.substring(2,4),10);
      if(!isNaN(a) && !isNaN(b)) list.push([a,b]);
    }
    return list;
  }

  // 从字符串中按性别偏好随机取一字
  function pickChar(strokes, sex){
    var pool = charsByStrokes(strokes);
    if(!pool) return '';
    var prefSet = sex==='女' ? FEMALE_CHARS : MALE_CHARS;
    var pref='';
    for(var i=0;i<pool.length;i++){
      var c=pool.charAt(i);
      for(var j=0;j<prefSet.length;j++){
        if(c===prefSet[j]){ pref+=c; break; }
      }
    }
    var src = pref || pool;
    if(!src) return '';
    return src.charAt(Math.floor(Math.random()*src.length));
  }

  function getSex(){
    var rs=document.getElementsByName('qmSex');
    for(var i=0;i<rs.length;i++){ if(rs[i].checked) return rs[i].value; }
    return '男';
  }

  function genOnce(){
    var surname=surInp.value.trim();
    if(!surname){ alert('请输入姓氏！'); surInp.focus(); return; }
    var r=document.getElementById('result');
    r.innerHTML='<div class="loading">正在生成...</div>';
    ensureData().then(ensureBihuaRows).then(function(){
      // 姓氏笔画（取首字）
      var firstChar=surname.charAt(0);
      var surnameBihua=bihuaMap[firstChar];
      if(surnameBihua==null){
        r.innerHTML='<div class="error">字库中未找到姓氏「'+esc(firstChar)+'」的笔画信息，请尝试其他常见姓氏。</div>';
        return;
      }
      var tpl=findTemplate(surnameBihua);
      if(!tpl){
        r.innerHTML='<div class="error">暂无笔画数为 '+surnameBihua+' 的起名模板，请尝试其他姓氏。</div>';
        return;
      }
      var groups=parseTemplate(tpl['内容']);
      if(!groups.length){
        r.innerHTML='<div class="error">起名模板解析失败，请尝试其他姓氏。</div>';
        return;
      }
      var sex=getSex();
      // 生成 6 个候选名字
      var names=[];
      for(var i=0;i<groups.length;i++){
        var a=groups[i][0], b=groups[i][1];
        var c1=pickChar(a, sex), c2=pickChar(b, sex);
        if(!c1 && !c2) continue;
        names.push({ c1:c1||pickChar(a,sex)||'?', c2:c2||'', a:a, b:b });
      }
      // 若不足 6 个，重复取
      while(names.length<6 && groups.length){
        var g=groups[Math.floor(Math.random()*groups.length)];
        names.push({ c1:pickChar(g[0],sex), c2:pickChar(g[1],sex), a:g[0], b:g[1] });
      }

      var html='<div class="result-box">';
      html+='<p>姓氏：<b style="color:#0066cc">'+esc(surname)+'</b>（康熙笔画 <b>'+surnameBihua+'</b> 画）　性别：<b>'+esc(sex)+'</b></p>';
      html+='<p style="color:#8a6a48;font-size:13px">依笔画模板 '+esc(String(tpl['内容']))+' 生成，共 '+names.length+' 个候选：</p>';
      html+='<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">';
      for(var k=0;k<names.length;k++){
        var nm=names[k];
        var full = surname + nm.c1 + nm.c2;
        html+='<a href="javascript:;" style="font-size:18px;color:#5a3a18;padding:14px 8px">'+esc(full)+'<div style="font-size:11px;color:#8a6a48;margin-top:4px">'+esc(nm.a)+'/'+esc(nm.b)+'画</div></a>';
      }
      html+='</div>';
      html+='<p style="color:#999;font-size:12px;margin-top:8px">(仅供起名参考)</p>';
      html+='</div>';
      r.innerHTML=html;
      document.getElementById('qmMoreBtn').style.display='inline-block';
    }).catch(function(e){
      r.innerHTML='<div class="error">数据加载失败：'+esc(e.message)+'</div>';
    });
  }

  document.getElementById('qmBtn').onclick=genOnce;
  document.getElementById('qmMoreBtn').onclick=genOnce;
})();
</script>
